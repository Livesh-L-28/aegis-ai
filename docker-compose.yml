networks:
  aegis-net:
    driver: bridge
  sim-net:
    driver: bridge
  obs-net:
    driver: bridge

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: aegis-postgres
    restart: unless-stopped
    networks:
      - aegis-net
      - sim-net
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
      POSTGRES_DB: ${POSTGRES_DB:-aegis}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-aegis}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: aegis-redis
    restart: unless-stopped
    networks:
      - aegis-net
      - sim-net
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: ghcr.io/coollabsio/minio:RELEASE.2025-10-15T17-29-55Z
    container_name: aegis-minio
    restart: unless-stopped
    networks:
      - aegis-net
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadminpassword}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 3

  aegis-api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
    container_name: aegis-api
    restart: unless-stopped
    networks:
      - aegis-net
      - obs-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      APP_NAME: "${APP_NAME:-AEGIS AI}"
      APP_VERSION: ${APP_VERSION:-0.1.0}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://postgres:postgrespassword@postgres:5432/aegis}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      OBJECT_STORAGE_ENDPOINT: ${OBJECT_STORAGE_ENDPOINT:-http://minio:9000}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-aegis-data}
      OBJECT_STORAGE_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      OBJECT_STORAGE_SECRET_KEY: ${S3_SECRET_KEY:-minioadminpassword}
      DEV_AUTH_ENABLED: "${DEV_AUTH_ENABLED:-true}"
      ALLOWED_HOSTS: '${ALLOWED_HOSTS:-["localhost","127.0.0.1","aegis-api"]}'
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  # --- Simulated Production Topology ---
  user-service:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
    container_name: aegis-sim-user
    restart: unless-stopped
    networks:
      - sim-net
      - obs-net
    command: ["uvicorn", "apps.simulated_production.user_service.main:app", "--host", "0.0.0.0", "--port", "8001"]
    ports:
      - "${USER_SERVICE_PORT:-8001}:8001"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  payment-service:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
    container_name: aegis-sim-payment
    restart: unless-stopped
    networks:
      - sim-net
      - obs-net
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    command: ["uvicorn", "apps.simulated_production.payment_service.main:app", "--host", "0.0.0.0", "--port", "8002"]
    ports:
      - "${PAYMENT_SERVICE_PORT:-8002}:8002"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8002/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  order-service:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
    container_name: aegis-sim-order
    restart: unless-stopped
    networks:
      - sim-net
      - obs-net
    depends_on:
      user-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      USER_SERVICE_URL: http://user-service:8001
      PAYMENT_SERVICE_URL: http://payment-service:8002
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://postgres:postgrespassword@postgres:5432/aegis}
    command: ["uvicorn", "apps.simulated_production.order_service.main:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  gateway:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
    container_name: aegis-sim-gateway
    restart: unless-stopped
    networks:
      - sim-net
      - obs-net
    depends_on:
      order-service:
        condition: service_healthy
    environment:
      ORDER_SERVICE_URL: http://order-service:8000
      USER_SERVICE_URL: http://user-service:8001
    command: ["uvicorn", "apps.simulated_production.gateway.main:app", "--host", "0.0.0.0", "--port", "8080"]
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  # --- Observability Stack ---
  loki:
    image: grafana/loki:3.0.0
    container_name: aegis-loki
    restart: unless-stopped
    networks:
      - obs-net
    ports:
      - "${LOKI_PORT:-3100}:3100"
    volumes:
      - ./infrastructure/observability/loki/loki-config.yml:/etc/loki/local-config.yaml
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml

  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: aegis-prometheus
    restart: unless-stopped
    networks:
      - obs-net
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./infrastructure/observability/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:11.0.0
    container_name: aegis-grafana
    restart: unless-stopped
    networks:
      - obs-net
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./infrastructure/observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./infrastructure/observability/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./infrastructure/observability/grafana/dashboards:/etc/grafana/provisioning/dashboards/json
      - grafana-data:/var/lib/grafana

volumes:
  postgres-data:
  redis-data:
  minio-data:
  loki-data:
  prometheus-data:
  grafana-data:
