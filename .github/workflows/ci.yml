name: AEGIS CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  quality-gates:
    name: Code Quality & Security Gates
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: aegis
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff Lint Check
        run: |
          ruff check .

      - name: Type Check (mypy)
        run: |
          mypy --explicit-package-bases logicfalcon aegis apps packages tests

      - name: Run Database Migrations (PostgreSQL + pgvector)
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@localhost:5432/aegis
        run: |
          alembic upgrade head

      - name: Run Test Suite (Unit, Integration, Security, Contract)
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@localhost:5432/aegis
          REDIS_URL: redis://localhost:6379/0
          ENVIRONMENT: test
        run: |
          pytest -v --cov=apps --cov=packages tests/

      - name: Build Docker Container
        run: |
          docker build -t aegis-api:latest -f infrastructure/docker/Dockerfile .

  frontend-quality-gates:
    name: Frontend TypeScript & Build Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: apps/web/package.json

      - name: Install Frontend Dependencies
        working-directory: apps/web
        run: npm ci

      - name: Frontend Typecheck and Production Build
        working-directory: apps/web
        run: npm run build
